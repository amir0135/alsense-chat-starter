[project]
name = "alsense-chat-starter"
version = "0.1.0"
description = "Standalone reference chatbot with synthetic APIs and backend-owned tools"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
    "pyyaml>=6,<7",
    "azure-ai-projects>=2.8,<3",
    "azure-identity>=1.26,<2",
    "azure-monitor-opentelemetry>=1.8.10,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.7", "mypy>=1.13,<2", "types-PyYAML>=6,<7"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "alsense_chat"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# These run before dependencies exist, on whatever Python is installed (3.8+), to explain what is missing.
"scripts/{dev,doctor,check_protected_files}.py" = ["UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
