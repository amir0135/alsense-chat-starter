# Report preparation, confirmation and status. Preparing never submits; only a confirm step does.
cases:
  - id: report-prepare-confirm-status
    description: A valid draft is confirmed explicitly and its job status is read back.
    user: alice
    steps:
      - say: '/report {"site_id":"site-a","report_type":"alarm-history","format":"pdf","start":"2026-01-01","end":"2026-01-31"}'
      - confirm: last
      - status: last
    expected:
      status: answer
      tool_calls: [prepare_report, get_report_status]
      submission: accepted
      text_includes: [Your synthetic report is ready.]

  - id: report-prepared-not-submitted
    description: Preparing a report creates a draft and nothing else.
    user: alice
    steps:
      - say: '/report {"site_id":"site-a","report_type":"site-status","format":"csv","start":"2026-01-01","end":"2026-01-31"}'
    expected:
      status: answer
      drafts: 1
      tool_calls: [prepare_report]
      must_not: [submit]

  - id: report-start-after-end
    description: The backend refuses an inverted period even when the form is bypassed.
    user: alice
    steps:
      - say: '/report {"site_id":"site-a","report_type":"alarm-history","format":"pdf","start":"2026-02-10","end":"2026-02-01"}'
    expected:
      status: clarification
      error_category: invalid_input
      drafts: 0
      text_includes: [The start date must be on or before the end date.]

  - id: report-period-too-long
    description: Report windows longer than a year are refused.
    user: alice
    steps:
      - say: '/report {"site_id":"site-a","report_type":"alarm-history","format":"pdf","start":"2024-01-01","end":"2026-01-01"}'
    expected:
      status: clarification
      error_category: invalid_input
      drafts: 0

  - id: report-unknown-format
    description: Only the formats the report service offers are accepted.
    user: alice
    steps:
      - say: '/report {"site_id":"site-a","report_type":"alarm-history","format":"exe","start":"2026-01-01","end":"2026-01-31"}'
    expected:
      status: clarification
      error_category: invalid_input
      drafts: 0

  - id: report-job-failed
    description: A failed job is reported as failed, never as ready.
    user: alice
    faults: [report_failed]
    steps:
      - say: '/report {"site_id":"site-a","report_type":"alarm-history","format":"pdf","start":"2026-01-01","end":"2026-01-31"}'
      - confirm: last
      - status: last
    expected:
      submission: accepted
      text_includes: [The report job failed]

  - id: report-types-listed
    description: Report types come from the report service.
    user: bob
    steps:
      - say: What report types are available?
    expected:
      status: answer
      tool_calls: [list_report_types]

  - id: reports-turned-off
    description: A disabled capability says so instead of failing.
    user: alice
    features: [troubleshooting, support]
    steps:
      - say: /reports
    expected:
      status: out_of_scope
      error_category: disabled
      text_includes: [Reports are turned off in this demo.]
