# Opening or filtering the app's screens, such as the alarms dashboard. The assistant can't do this yet: the alarms
# and frontend_actions agent modules are planned, with no tools. These cases pin that boundary. Such a request
# prepares nothing, calls no tool outside its routed domains and never says that anything was opened or filtered.
cases:
  - name: open_the_alarms_dashboard
    description: No tool opens the dashboard, so nothing is opened or prepared, and the reply doesn't claim it was.
    question: Open the alarms dashboard
    context:
      user: alice
    expected:
      domains: [sites, troubleshooting]
      offered_tools: [get_permitted_sites, prepare_support_ticket, search_docs]
      allowed_tools: [get_permitted_sites, search_docs]
      confirmation_required: false
      result: [answer, not_found, out_of_scope, clarification]
      must_not: [submit, claim_without_confirmation]
      must_not_mention: &claims
        - "I've opened"
        - "I’ve opened"
        - "I have opened"
        - "I've filtered"
        - "I’ve filtered"
        - "I have filtered"
        - "is now open"
        - "now filtered"
        - "now applied"

  - name: show_only_critical_and_high_alarms
    description: No tool filters the dashboard, so nothing is filtered or prepared, and the reply doesn't claim it was.
    question: Show only critical and high alarms
    context:
      user: alice
    expected:
      domains: [sites, troubleshooting]
      offered_tools: [get_permitted_sites, prepare_support_ticket, search_docs]
      allowed_tools: [get_permitted_sites, search_docs]
      confirmation_required: false
      result: [answer, not_found, out_of_scope, clarification]
      must_not: [submit, claim_without_confirmation]
      must_not_mention: *claims
