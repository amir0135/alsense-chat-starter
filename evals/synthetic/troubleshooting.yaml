# Guided troubleshooting. Guided checks are deterministic in both modes: the backend runs the tree.
cases:
  - name: site_connection_unreachable
    description: A misspelled site resolves to Demo North and the backend finds its gateway offline.
    steps:
      - flow: site-connection
        answers: ["no", "demo nrth", "yes"]
    expected:
      tools: [get_permitted_sites, check_site_health]
      status: answer
      result: flow:connectivity_guidance
      flow:
        outcome: resolve
        resolved_site: Demo North
      must_not: [prepare_support_ticket, submit, use_unauthorized_site, guess_site_id]

  - name: site_connection_needs_support
    description: No open gateway checks, so the tree ends in a prefilled support request.
    context:
      user: bob
    steps:
      - flow: site-connection
        answers: ["no", "Demo South"]
    expected:
      tools: [get_permitted_sites, check_site_health]
      status: answer
      result: flow:needs_investigation
      flow:
        outcome: ticket
        resolved_site: Demo South
      must_not: [submit]

  - name: data_still_arriving
    description: Readings are arriving, so no lookup runs at all.
    steps:
      - flow: site-connection
        answers: ["yes"]
    expected:
      tools: []
      status: answer
      result: flow:connection_ok
      flow:
        outcome: ticket

  - name: site_not_identified
    description: Three failed attempts end with a support request instead of a guess.
    steps:
      - flow: site-connection
        answers: ["no", "zzz", "qqq", "www"]
    expected:
      tools: [get_permitted_sites]
      result: flow:site_not_identified
      flow:
        outcome: ticket
        resolved_site: Not identified

  - name: ambiguous_site_asks_which
    description: Two sites match equally well, so the guided check asks instead of guessing.
    context:
      user: carol
    steps:
      - flow: site-connection
        answers: ["no", "demo east"]
    expected:
      tools: [get_permitted_sites]
      result: clarification
      clarification:
        options: [Demo East Hall, Demo East Depot]
        text_includes: ["I found more than one matching site."]

  - name: health_service_down_stops_explicitly
    description: A failed lookup stops the flow with the reason, never the "no" branch.
    context:
      faults: [health_unavailable]
    steps:
      - flow: site-connection
        answers: ["no", "Demo North"]
    expected:
      tools: [get_permitted_sites, check_site_health]
      status: error
      error_category: unavailable
      result: flow:lookup_unavailable
      flow:
        outcome: ticket
      must_not_mention: ["The gateway looks online"]

  - name: stale_health_not_trusted
    description: Hours-old health data is reported as out of date, not used.
    context:
      faults: [health_stale]
    steps:
      - flow: site-connection
        answers: ["no", "Demo North"]
    expected:
      status: error
      error_category: stale
      result: flow:lookup_stale

  - name: free_text_starts_the_flow
    description: Trigger words start the matching guided check.
    question: Our site is unreachable since this morning
    expected:
      tools: []
      result: clarification
      flow:
        step: question

  - name: offline_sensor_guidance
    description: Troubleshooting guidance comes only from approved documents.
    question: My sensor is offline. What should I check?
    expected:
      tools: [search_docs]
      result: answer
      evidence: [Synthetic alarm and report guide]
      text_includes: ["Demo North"]
      domains: [sites, troubleshooting]
      must_not: [prepare_support_ticket, prepare_report, offer_unrelated_tools]

  - name: no_approved_answer
    description: Nothing approved matches, so the assistant says so instead of inventing advice.
    context:
      user: bob
    question: /docs compressor calibration
    expected:
      tools: [search_docs]
      result: not_found
      text_includes: ["No approved guidance matches this issue."]
